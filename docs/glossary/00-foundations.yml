# Glossary: Foundations

terms:

  - term: "Full Column Rank"
    definition: "A matrix has full column rank if all its columns are linearly independent — no column can be expressed as a linear combination of the others. This is the condition that guarantees the OLS estimator has a unique solution."
    mathematical: |
      An $N \times K$ matrix $\mathbf{X}$ has full column rank when $\text{rank}(\mathbf{X}) = K$.

      Equivalently, $\mathbf{X}^T\mathbf{X}$ is invertible (non-singular), which is required for the OLS closed-form:
      $$\hat{\boldsymbol{\beta}} = (\mathbf{X}^T\mathbf{X})^{-1}\mathbf{X}^T\mathbf{y}$$

      The condition fails when regressors are perfectly collinear — one column is an exact linear combination of others — making $\mathbf{X}^T\mathbf{X}$ singular and $\hat{\boldsymbol{\beta}}$ undefined.
    historical: |
      - 1858: Cayley introduces matrix algebra and formalises the concept of rank
      - 1888: Sylvester coins the term "rank" for matrices
      - Mid-20th century: Full-rank condition becomes the standard identification requirement for OLS uniqueness in Gauss-Markov theorem statements
    reference: "00-foundations/ols-assumptions.md#the-5-classical-ols-assumptions-and-how-time-series-violates-them"

  - term: "i.i.d"
    definition: "A sequence of random variables is independent and identically distributed (i.i.d.) when each variable is drawn from the same distribution and is statistically independent of every other variable in the sequence. The i.i.d. assumption is the baseline error structure of the classical linear regression model and the dividing line between cross-sectional methods and time series analysis."
    mathematical: |
      Random variables $X_1, X_2, \ldots, X_T$ are i.i.d. if both conditions hold:

      1. **Independence** — the joint distribution factorises into marginals,
      $$P(X_1 \le x_1, \ldots, X_T \le x_T) = \prod_{t=1}^{T} P(X_t \le x_t).$$

      2. **Identical distribution** — every $X_t$ shares the same distribution function $F$,
      $$X_t \sim F \quad \text{for all } t = 1, \ldots, T.$$

      In regression notation, the i.i.d. error assumption is written
      $$\epsilon_t \sim \text{i.i.d.}(0, \sigma^2),$$
      meaning the errors are independent across $t$, share a common mean (zero) and variance ($\sigma^2$), and — under the additional Gaussian assumption — share a common normal distribution: $\epsilon_t \sim \text{i.i.d.} \ \mathcal{N}(0, \sigma^2)$.
    historical: |
      - 1713: Jakob Bernoulli's *Ars Conjectandi* (posthumous) introduces Bernoulli trials, the first formal i.i.d. construction
      - 1933: Kolmogorov's *Foundations of the Theory of Probability* axiomatises probability and gives independence its modern measure-theoretic definition
      - 1946: Cramér's *Mathematical Methods of Statistics* establishes "independent and identically distributed" as standard terminology in mathematical statistics
      - 1950: Feller's *An Introduction to Probability Theory and Its Applications* (vol. 1) consolidates the i.i.d. abbreviation in applied probability
    foundation: true
    reference: "00-foundations/do-you-need-time-series-analysis.md#feature-engineering-vs-time-series-modelling"

  - term: "Closed-Form Solution"
    definition: "An exact expression evaluated in a finite number of standard operations, requiring no iteration or numerical approximation."
    mathematical: |
      The OLS estimator is a closed-form solution:
      $$\hat{\boldsymbol{\beta}} = (\mathbf{X}^T\mathbf{X})^{-1}\mathbf{X}^T\mathbf{y}$$

      This contrasts with iterative methods such as gradient descent, which approximate the solution through repeated updates and may not converge to the exact optimum.

      Existence requires $\mathbf{X}^T\mathbf{X}$ to be invertible; see Full Column Rank.
    historical: |
      - 1805: Legendre publishes the method of least squares, the first statement of the OLS objective
      - 1809: Gauss derives the same method independently for planetary orbit estimation and establishes the normal equations
      - 20th century: Matrix notation consolidates the normal equations into the compact closed-form $\hat{\boldsymbol{\beta}} = (\mathbf{X}^T\mathbf{X})^{-1}\mathbf{X}^T\mathbf{y}$
    reference: "00-foundations/ols-assumptions.md#the-5-classical-ols-assumptions-and-how-time-series-violates-them"

  - term: "Gauss–Markov Conditions"
    definition: "The assumptions on the error term under which the ordinary least squares estimator is the best linear unbiased estimator (BLUE) — the minimum-variance estimator among all linear unbiased estimators. They require the errors to have zero conditional mean, constant variance, and no serial correlation, with regressors of full column rank."
    mathematical: |
      For the linear model $y_t = \mathbf{x}_t^T \boldsymbol{\beta} + \epsilon_t$ with regressor matrix $\mathbf{X}$, the conditions are:

      1. **Linearity in parameters** — the model is linear in $\boldsymbol{\beta}$.
      2. **Strict exogeneity** — $\mathbb{E}[\epsilon_t \mid \mathbf{X}] = 0$.
      3. **Homoskedasticity** — $\text{Var}(\epsilon_t \mid \mathbf{X}) = \sigma^2$ for every $t$.
      4. **No autocorrelation** — $\text{Cov}(\epsilon_t, \epsilon_s \mid \mathbf{X}) = 0$ for $t \neq s$.
      5. **Full column rank** — $\text{rank}(\mathbf{X}) = K$ (no perfect collinearity).

      Under conditions 1–5 the Gauss–Markov theorem states that the OLS estimator $\hat{\boldsymbol{\beta}} = (\mathbf{X}^T\mathbf{X})^{-1}\mathbf{X}^T\mathbf{y}$ has the smallest variance among all linear unbiased estimators. Normality of the errors is not required. 
    historical: |
      - 1821–1823: Gauss proves the variance-minimising property of least squares in *Theoria Combinationis Observationum Erroribus Minimis Obnoxiae*, without assuming normal errors
      - 1912: Markov restates the result in his treatment of probability, and the modern name "Gauss–Markov" credits this exposition
      - 1935: Aitken extends the theorem to correlated and heteroskedastic errors, giving generalized least squares (GLS)
    reference: "00-foundations/logic-of-statistical-analysis.md#ordinary-least-squares-ols"

  - term: "Stationarity"
    definition: "A time series is stationary if its statistical properties do not change over time."
    mathematical: |
      **Weak (covariance) stationarity** requires:
      - Constant mean: $E[y_t] = \mu$ for all $t$
      - Constant variance: $\text{Var}(y_t) = \sigma^2$ for all $t$
      - Autocovariance depends only on lag: $\gamma_k = \text{Cov}(y_t, y_{t-k})$

      **Strict stationarity**: The joint distribution $(y_{t_1}, \ldots, y_{t_n})$ is identical to $(y_{t_1+h}, \ldots, y_{t_n+h})$ for any $h$.
    historical: |
      - 1927: Yule introduces autoregressive processes
      - 1938: Wold decomposition theorem established
      - 1970: Box-Jenkins methodology formalises stationarity requirements
    foundation: true
    reference: "00-foundations/stochastic-processes.md#stochastic-processes"

  - term: "White Noise"
    definition: "A sequence of uncorrelated random variables with zero mean and constant variance."
    mathematical: |
      A process $\\{\varepsilon_t\\}$ is white noise if:
      - $E[\varepsilon_t] = 0$ for all $t$
      - $\text{Var}(\varepsilon_t) = \sigma^2$ for all $t$
      - $\text{Cov}(\varepsilon_t, \varepsilon_s) = 0$ for $t \neq s$

      **Strong white noise** additionally requires independence: $\varepsilon_t \perp \varepsilon_s$ for $t \neq s$

      **Gaussian white noise**: $\varepsilon_t \sim N(0, \sigma^2)$ i.i.d.
    historical: |
      - 1938: Wold decomposition theorem establishes white noise as the irreducible innovation component
      - 1970: Box and Jenkins formalise residual white noise as the diagnostic criterion for model adequacy
    foundation: true
    reference: "00-foundations/stochastic-processes.md#white-noise-martingale-difference-independence"

  - term: "Probability density"
    definition: "Probability per unit volume. For a continuous variable the probability of any exact value is zero; the density is the limit of the probability of a small neighbourhood divided by its volume."
    foundation: true
    reference: "00-foundations/stochastic-processes.md#probability-density"

  - term: "Independence"
    definition: "Random variables are independent when their joint distribution equals the product of their marginal distributions. Independence implies uncorrelatedness; the converse fails."
    foundation: true
    reference: "00-foundations/stochastic-processes.md#independence"

  - term: "Kolmogorov extension theorem"
    definition: "A consistent family of finite-dimensional joint distributions determines a unique probability law for the whole stochastic process. This is what makes it legitimate to define a model class as a family of distributions for the entire sequence."
    foundation: true
    reference: "00-foundations/stochastic-processes.md#kolmogorov-extension-theorem"

  - term: "KL divergence"
    definition: "The Kullback-Leibler divergence from a true distribution to a model distribution is the expected log-ratio of their densities under the truth. It is non-negative and zero only when the two coincide."
    foundation: true
    reference: "00-foundations/stochastic-processes.md#kl-divergence"

  - term: "Law of large numbers"
    definition: "A sample average converges to the corresponding expectation as the sample grows. For dependent data the result needs stationarity and ergodicity (or mixing) in place of independence."
    foundation: true
    reference: "00-foundations/asymptotics.md#law-of-large-numbers"

  - term: "Joint density"
    definition: "The probability per unit volume of the whole sample (y_1, ..., y_T) regarded as one point in R^T."
    derivation: |
      1. The T observations form one point in $\mathbb{R}^T$. The joint density $p(y_1, \ldots, y_T; \theta)$ is the probability per unit volume near that point. A density is used because a continuous variable takes any exact value with probability zero; only "falls in a small neighbourhood" has positive probability, and dividing by the neighbourhood's volume gives the density. The volume factor does not depend on $\theta$, so it does not move the argmax.
      2. The object must be joint because the information about $\theta$ sits in the relations between observations. In AR(1), $\phi$ appears only in the conditional distribution of $y_t$ given $y_{t-1}$; the marginal $\mathcal{N}(0, \sigma^2/(1-\phi^2))$ confounds $\phi$ with $\sigma$. Using marginals alone discards the part being estimated.
      3. A process has a joint distribution to speak of because of the Kolmogorov extension theorem: a consistent family of finite-dimensional joint distributions determines the law of the whole process. This is also what makes the model-class definition "a family of distributions indexed by parameters" legitimate.
      4. Density and likelihood are one function read two ways. Fix $\theta$ and vary $y$: a density, integrating to one over $y$. Fix the observed $y$ and vary $\theta$: a likelihood, which does not integrate to one over $\theta$, so it is not a probability distribution of $\theta$. Adding a prior makes it one; that is the link to Bayesian estimation.
      5. "Highest data density" means "most reasonable $\theta$" because $\frac{1}{T}\log L(\theta) \to \mathbb{E}[\log p(y; \theta)]$, and maximising that minimises $\mathrm{KL}(\text{truth} \,\|\, p_\theta)$. MLE picks the model closest to the truth in KL divergence, even when the model class is wrong (the QMLE pseudo-true value).
    depends_on: ["Probability density", "Independence", "Kolmogorov extension theorem", "KL divergence", "Law of large numbers"]
    reference: "reference/04-estimation/index.md#joint-density"
