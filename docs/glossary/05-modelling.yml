# Glossary: Chapter 05 — Modelling

terms:

  - term: "ARIMA"
    definition: "AutoRegressive Integrated Moving Average. A general class of models for time series forecasting."
    mathematical: |
      ARIMA($p$, $d$, $q$) model:
      $$(1 - \phi_1 B - \cdots - \phi_p B^p)(1-B)^d y_t = (1 + \theta_1 B + \cdots + \theta_q B^q)\varepsilon_t$$

      Where:
      - $p$ = AR order
      - $d$ = degree of differencing
      - $q$ = MA order
      - $B$ = backshift operator: $By_t = y_{t-1}$
    historical: |
      - 1927: Yule introduces autoregressive processes
      - 1937: Slutsky introduces moving average processes
      - 1970: Box and Jenkins publish the comprehensive ARIMA methodology
    reference: "05-modelling/01-arima.html"

  - term: "GARCH"
    definition: "Generalized AutoRegressive Conditional Heteroskedasticity. Models time-varying volatility."
    mathematical: |
      GARCH($p$, $q$) model:
      $$y_t = \sigma_t \varepsilon_t, \quad \varepsilon_t \sim N(0,1)$$
      $$\sigma_t^2 = \omega + \sum_{i=1}^q \alpha_i y_{t-i}^2 + \sum_{j=1}^p \beta_j \sigma_{t-j}^2$$

      Conditions:
      - $\omega > 0$, $\alpha_i \geq 0$, $\beta_j \geq 0$
      - $\sum_{i=1}^{\max(p,q)} (\alpha_i + \beta_i) < 1$ (stationarity)
    historical: |
      - 1982: Engle introduces the ARCH model
      - 1986: Bollerslev generalises to GARCH
      - 2003: Engle receives the Nobel Prize in Economics
    reference: "05-modelling/05-volatility-garch.html"
