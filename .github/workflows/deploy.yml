name: Deploy MkDocs to GitHub Pages

on:
  # Pull requests run every gate (tests, audit, strict build) before merge
  pull_request:
    branches:
      - main

  # Pushes to main run the same gates, then deploy
  push:
    branches:
      - main

  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job: the gates, on every event
  build:
    runs-on: ubuntu-latest
    # A newer push to the same ref supersedes a running check
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for git info plugin

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation toolchain
        run: |
          pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Install the browser for the pinned Playwright
        run: playwright install --with-deps chromium

      - name: Run tests (the browser smoke test must run, not skip)
        env:
          TSAM_REQUIRE_E2E: "1"
        run: pytest tests -q

      - name: Audit flowcharts, inventory and glossary
        run: python scripts/audit_flowcharts.py

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  # Deploy job: pushes to main only, one deployment at a time
  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
